[project]
name = "llm-modelfit"
version = "0.2.0"
description = "Estimation des besoins mémoire des LLM sur plateformes GPU et Edge"
requires-python = ">=3.9"
dependencies = [
    "huggingface_hub",
    "requests",
    "python-dotenv",
    "platformdirs",
]

[project.optional-dependencies]
# l'interface web Flask : inutile pour une autre application qui n'utilise que le calcul
webapp = ["flask"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["llm_modelfit*"]

[tool.setuptools.package-data]
"llm_modelfit" = ["data/*.json"]
