[project]
name = "llm-modelfit"
version = "0.1.0"
description = "Estimation des besoins mémoire des LLM sur plateformes GPU et Edge"
requires-python = ">=3.9"
dependencies = [
    "huggingface_hub",
    "requests",
    "python-dotenv",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["llm_modelfit*"]

[tool.setuptools.package-data]
"llm_modelfit" = ["data/*.json"]
